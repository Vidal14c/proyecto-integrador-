<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocare - Asistente de Medicación</title>
    <!-- Tailwind CSS para estilos rápidos y accesibles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animación para indicar que el micrófono está escuchando */
        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .mic-active {
            background-color: #ef4444 !important; /* Rojo */
            color: white !important;
            position: relative;
        }
        .mic-active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 4px solid #ef4444;
            animation: pulse-ring 1.5s infinite;
            z-index: -1;
        }
        /* Ocultar elementos */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-yellow-50 text-gray-800 font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- CABECERA -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center text-xl font-bold border-b-4 border-yellow-400">
        <h1 class="text-2xl text-gray-800"><i class="fa-solid fa-pills text-blue-600 mr-2"></i>Vocare</h1>
        <button aria-label="Configuración" class="p-2 focus-visible:outline focus-visible:outline-4 focus-visible:outline-blue-600 rounded">
            <i class="fa-solid fa-gear text-gray-600 text-2xl"></i>
        </button>
    </header>

    <!-- VISTA PRINCIPAL (DASHBOARD) -->
    <main id="view-home" class="flex-grow flex flex-col items-center justify-center p-6 text-center">
        
        <div id="status-text" class="text-2xl font-bold mb-8 text-gray-700 min-h-[4rem]">
            Toca el micrófono y haz una pregunta
        </div>

        <!-- Botón Gigante (Mejora de Accesibilidad y Heurística) -->
        <button id="btn-mic" aria-label="Presiona para hablar" class="bg-blue-600 text-white rounded-full w-48 h-48 flex items-center justify-center text-7xl shadow-xl transition-all duration-300 focus-visible:outline focus-visible:outline-8 focus-visible:outline-blue-300">
            <i class="fa-solid fa-microphone"></i>
        </button>

        <div id="transcription-box" class="mt-8 text-xl text-gray-600 min-h-[3rem] italic p-4 bg-white rounded-lg shadow w-full max-w-md hidden">
            <!-- Aquí aparece lo que el usuario dijo (Mejora heurística: reconocimiento vs recuerdo) -->
        </div>

    </main>

    <!-- VISTA HISTORIAL (LISTA DE MEDICAMENTOS) -->
    <main id="view-history" class="flex-grow flex flex-col items-center justify-start p-6 text-center hidden overflow-y-auto">
        <h2 class="text-3xl font-bold mb-6 text-gray-800 w-full text-left border-b-2 border-gray-200 pb-2">Tus Medicamentos</h2>
        
        <!-- Tarjeta de Medicamento 1 -->
        <div class="bg-white w-full max-w-md rounded-xl shadow-md p-6 mb-4 flex items-center justify-between border-l-8 border-green-500">
            <div class="text-left">
                <h3 class="text-2xl font-bold text-gray-800">Paracetamol</h3>
                <p class="text-xl text-gray-600">500 mg - Cada 8 horas</p>
                <p class="text-lg font-bold text-green-600 mt-1"><i class="fa-regular fa-clock mr-1"></i>Próxima: 8:00 PM</p>
            </div>
            <button class="text-red-500 p-4 rounded-full hover:bg-red-50 focus-visible:outline focus-visible:outline-4 focus-visible:outline-red-500" onclick="confirmDelete()">
                <i class="fa-solid fa-trash-can text-3xl"></i>
            </button>
        </div>

        <!-- Tarjeta de Medicamento 2 -->
        <div class="bg-white w-full max-w-md rounded-xl shadow-md p-6 mb-4 flex items-center justify-between border-l-8 border-blue-500">
            <div class="text-left">
                <h3 class="text-2xl font-bold text-gray-800">Losartán</h3>
                <p class="text-xl text-gray-600">50 mg - Una al día</p>
                <p class="text-lg font-bold text-blue-600 mt-1"><i class="fa-solid fa-check mr-1"></i>Tomada hoy</p>
            </div>
            <button class="text-red-500 p-4 rounded-full hover:bg-red-50 focus-visible:outline focus-visible:outline-4 focus-visible:outline-red-500" onclick="confirmDelete()">
                <i class="fa-solid fa-trash-can text-3xl"></i>
            </button>
        </div>
    </main>

    <!-- NAVEGACIÓN INFERIOR (Corregida tras Testing UX) -->
    <nav class="bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] flex justify-around p-2 pb-4">
        <button id="nav-home" class="flex flex-col items-center p-3 text-blue-600 border-t-4 border-blue-600 w-1/2">
            <i class="fa-solid fa-house text-3xl mb-1"></i>
            <span class="text-lg font-bold">Inicio</span>
        </button>
        <button id="nav-history" class="flex flex-col items-center p-3 text-gray-500 border-t-4 border-transparent hover:text-blue-600 w-1/2">
            <i class="fa-solid fa-list-ul text-3xl mb-1"></i>
            <span class="text-lg font-bold">Lista</span>
        </button>
    </nav>

    <!-- Modal de Confirmación (Previene errores críticos) -->
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-[90%] text-center">
            <i class="fa-solid fa-triangle-exclamation text-yellow-500 text-6xl mb-4"></i>
            <h2 class="text-2xl font-bold mb-2 text-gray-800">¿Estás seguro?</h2>
            <p class="text-xl text-gray-600 mb-8">Vas a borrar este medicamento de tu lista.</p>
            <div class="flex justify-between space-x-4">
                <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-800 py-4 rounded-xl text-xl font-bold">Cancelar</button>
                <button onclick="closeModal()" class="flex-1 bg-red-600 text-white py-4 rounded-xl text-xl font-bold">Sí, borrar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE INTERACCIÓN Y TECNOLOGÍA EMERGENTE (Web Speech API) -->
    <script>
        // Configuración de la IA de Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        const synth = window.speechSynthesis;
        let isListening = false;

        // Elementos del DOM
        const btnMic = document.getElementById('btn-mic');
        const statusText = document.getElementById('status-text');
        const transBox = document.getElementById('transcription-box');
        
        const navHome = document.getElementById('nav-home');
        const navHistory = document.getElementById('nav-history');
        const viewHome = document.getElementById('view-home');
        const viewHistory = document.getElementById('view-history');
        const modal = document.getElementById('delete-modal');

        // Inicializar Reconocimiento de Voz
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'es-ES'; // Idioma español
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                btnMic.classList.add('mic-active');
                btnMic.classList.remove('bg-blue-600');
                statusText.innerText = "Escuchando... Puedes hablar.";
                transBox.classList.add('hidden');
                // Efecto de sonido (Simulado por usabilidad)
                beep(800, 100); 
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                transBox.innerText = `Tú dijiste: "${transcript}"`;
                transBox.classList.remove('hidden');
                processVoiceCommand(transcript);
            };

            recognition.onerror = (event) => {
                statusText.innerText = "No pude escucharte bien. Toca e intenta de nuevo.";
                resetMicBtn();
            };

            recognition.onend = () => {
                isListening = false;
                resetMicBtn();
            };
        } else {
            statusText.innerText = "Tu navegador no soporta el asistente de voz.";
            btnMic.disabled = true;
        }

        // Procesamiento de Lenguaje Natural (Simulado para el Prototipo)
        function processVoiceCommand(text) {
            statusText.innerText = "Pensando...";
            let response = "";

            if (text.includes("qué") && (text.includes("toca") || text.includes("pastilla") || text.includes("medicamento"))) {
                response = "Te toca tomar Paracetamol de 500 miligramos a las 8 de la noche.";
            } else if (text.includes("lista") || text.includes("historial") || text.includes("tengo")) {
                response = "Tienes registrado Paracetamol y Losartán. Te muestro la lista en pantalla.";
                switchTab('history');
            } else {
                response = "No te entendí bien. Prueba preguntando '¿Qué pastilla me toca ahora?'.";
            }

            setTimeout(() => {
                statusText.innerText = "Toca el micrófono y haz una pregunta";
                speak(response);
            }, 1000);
        }

        // Síntesis de Voz (TTS)
        function speak(text) {
            if (synth.speaking) {
                synth.cancel();
            }
            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.lang = 'es-ES';
            utterThis.rate = 0.9; // Velocidad un poco más lenta para adultos mayores
            synth.speak(utterThis);
        }

        // Funciones de UI
        function resetMicBtn() {
            btnMic.classList.remove('mic-active');
            btnMic.classList.add('bg-blue-600');
            if(!synth.speaking) statusText.innerText = "Toca el micrófono y haz una pregunta";
        }

        btnMic.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // Generador de Bip (Feedback auditivo)
        function beep(freq, duration) {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = context.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.value = freq;
            oscillator.connect(context.destination);
            oscillator.start();
            setTimeout(() => { oscillator.stop(); }, duration);
        }

        // Navegación
        function switchTab(tab) {
            if(tab === 'home') {
                viewHome.classList.remove('hidden');
                viewHistory.classList.add('hidden');
                navHome.classList.replace('text-gray-500', 'text-blue-600');
                navHome.classList.replace('border-transparent', 'border-blue-600');
                navHistory.classList.replace('text-blue-600', 'text-gray-500');
                navHistory.classList.replace('border-blue-600', 'border-transparent');
            } else {
                viewHome.classList.add('hidden');
                viewHistory.classList.remove('hidden');
                navHistory.classList.replace('text-gray-500', 'text-blue-600');
                navHistory.classList.replace('border-transparent', 'border-blue-600');
                navHome.classList.replace('text-blue-600', 'text-gray-500');
                navHome.classList.replace('border-blue-600', 'border-transparent');
            }
        }

        navHome.addEventListener('click', () => switchTab('home'));
        navHistory.addEventListener('click', () => switchTab('history'));

        // Modal de borrado
        function confirmDelete() {
            modal.classList.remove('hidden');
            speak("¿Estás seguro de que quieres borrar este medicamento?");
        }
        
        function closeModal() {
            modal.classList.add('hidden');
            synth.cancel();
        }
    </script>
</body>
</html>
